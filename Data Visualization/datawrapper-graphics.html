<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Datawrapper Graphics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
   <main class="container my-4">
    <div class="row">
      <div class="col-md-12">
        
        <p>Here's a chart on hot-related deaths in Maryland and Baltimore:</p>

        <div class="my-4">
          <iframe title="Hot-related deaths in Maryland and Baltimore" aria-label="Small multiple pie chart" id="datawrapper-chart-zFTDo" src="https://datawrapper.dwcdn.net/zFTDo/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="701" data-external="1"></iframe><script type="text/javascript">(function(){function e(){window.addEventListener(`message`,function(e){if(e.data[`datawrapper-height`]!==void 0){var t=document.querySelectorAll(`iframe`);for(var n in e.data[`datawrapper-height`])for(var r=0,i;i=t[r];r++)if(i.contentWindow===e.source){var a=e.data[`datawrapper-height`][n]+`px`;i.style.height=a}}})}e()})();</script>
        </div>

        <p> And here's a chart on the projected number of extreme heat events in Maryland in the year 2040:</p>

        <div class="my-4">
        <iframe title="Projected number of extreme heat events in Maryland for the year 2040" aria-label="Choropleth map" id="datawrapper-chart-AAHtD" src="https://datawrapper.dwcdn.net/AAHtD/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="440" data-external="1"></iframe>
        </div>

      </div>
    </div>
  </main>
    
</body>
</html>
